name: 自动更新开奖公式

on:
  push:
    branches:
      - main
  schedule:
    # 北京时间每天 12:20、18:20、21:20、03:20 做常规补查。
    - cron: "20 4,10,13,19 * * *"
    # 开奖后的关键时段每 10 分钟检查一次：北京时间 23:00 至次日 00:50。
    # 没有新开奖时只执行轻量检查，不生成图片，也不部署。
    - cron: "*/10 15-16 * * *"
  workflow_dispatch:
    inputs:
      force_deploy:
        description: "没有新开奖时也测试构建和部署"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: lottery-auto-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 检查是否出现新一期
        id: check
        run: python scripts/check_lottery_updates.py --github-output "$GITHUB_OUTPUT"

      - name: 安装 JSON 清单依赖
        if: steps.check.outputs.changed == 'true'
        run: python -m pip install --disable-pip-version-check Pillow

      - name: 分彩种计算并立即保存进度
        if: steps.check.outputs.changed == 'true'
        env:
          LIUHE_FONT: /usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc
        run: |
          git config user.name "六合自动更新"
          git config user.email "actions@users.noreply.github.com"
          for lottery_type in ${{ steps.check.outputs.types }}; do
            echo "开始更新彩种 ${lottery_type}"
            git pull --rebase origin main
            python -u scripts/lottery_cache_refresh.py --type "${lottery_type}" --year "$(date +%Y)"
            python -u scripts/update_all_lotteries.py --types "${lottery_type}" --year "$(date +%Y)" &
            generator_pid=$!
            while kill -0 "${generator_pid}" 2>/dev/null; do
              echo "彩种 ${lottery_type} 仍在计算中，请勿中断"
              sleep 60
            done
            wait "${generator_pid}"
            git add scripts/archive_formula_history.py lib/formula-history.ts data public/generated lib/formula-manifests.ts lib/home-board-data.ts app/page.tsx app/posts app/TailHeadFormulaPost.tsx
            if ! git diff --cached --quiet; then
              git commit -m "自动保存彩种 ${lottery_type} 更新进度 [skip ci]"
            fi
            git push
          done

      - uses: pnpm/action-setup@v4
        if: github.event_name == 'push' || steps.check.outputs.changed == 'true' || inputs.force_deploy == true
        with:
          version: 10

      - uses: actions/setup-node@v4
        if: github.event_name == 'push' || steps.check.outputs.changed == 'true' || inputs.force_deploy == true
        with:
          node-version: "22"
          cache: pnpm

      - name: 构建网站
        if: github.event_name == 'push' || steps.check.outputs.changed == 'true' || inputs.force_deploy == true
        run: |
          pnpm install --frozen-lockfile
          python scripts/generate_home_board_data.py
          # 当前生肖清单只保留展示数据；完整逐期记录保存在 formula-history。
          python - <<'PY'
          import json
          from pathlib import Path

          def strip_duplicate_history(value):
              if isinstance(value, dict):
                  value.pop("history", None)
                  for child in value.values():
                      strip_duplicate_history(child)
              elif isinstance(value, list):
                  for child in value:
                      strip_duplicate_history(child)

          for path in Path("public/generated/zodiac").glob("*-manifest.json"):
              data = json.loads(path.read_text(encoding="utf-8"))
              strip_duplicate_history(data)
              path.write_text(json.dumps(data, ensure_ascii=False, separators=(",", ":")), encoding="utf-8")
              print(f"已精简重复生肖历史：{path}")
          PY
          python scripts/externalize_formula_assets.py
          python scripts/publish_history_shards.py
          pnpm run build
          python scripts/publish_history_shards.py --prune-build

      - name: 发布公式程序后端
        if: github.event_name == 'push' || steps.check.outputs.changed == 'true' || inputs.force_deploy == true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy --config dist/server/wrangler.json --name liuhe-formula-poster-backend

      - name: 发布轻量缓存入口
        if: github.event_name == 'push' || steps.check.outputs.changed == 'true' || inputs.force_deploy == true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy --config wrangler-cache.jsonc

      - name: 发布成功后确认历史已保存
        if: github.event_name == 'push' || steps.check.outputs.changed == 'true' || inputs.force_deploy == true
        run: |
          git config user.name "六合自动更新"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/archive_formula_history.py lib/formula-history.ts data public/generated lib/formula-manifests.ts lib/home-board-data.ts app/page.tsx app/posts app/TailHeadFormulaPost.tsx
          if ! git diff --cached --quiet; then
            git commit -m "自动更新新一期公式 [skip ci]"
          fi
          git push


      - name: 预热首页和历史帖子
        if: github.event_name == 'push' || steps.check.outputs.changed == 'true' || inputs.force_deploy == true
        run: node scripts/prewarm_formula_pages.mjs
