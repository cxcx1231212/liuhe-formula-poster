name: 自动更新开奖公式

on:
  push:
    branches:
      - main
  schedule:
    # 北京时间每天 12:20、18:20、21:20、03:20 做常规补查。
    - cron: "20 4,10,13,19 * * *"
    # 开奖后的关键时段每 10 分钟检查一次：北京时间 23:00 至次日 00:50。
    # 没有新开奖时只执行轻量检查，不生成图片，也不部署。
    - cron: "*/10 15-16 * * *"
  workflow_dispatch:
    inputs:
      force_deploy:
        description: "没有新开奖时也测试构建和部署"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: lottery-auto-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 检查是否出现新一期
        id: check
        run: python scripts/check_lottery_updates.py --github-output "$GITHUB_OUTPUT"

      - name: 安装 JSON 清单依赖
        if: steps.check.outputs.changed == 'true'
        run: python -m pip install --disable-pip-version-check Pillow

      - name: 分彩种计算并立即保存进度
        if: steps.check.outputs.changed == 'true'
        env:
          LIUHE_FONT: /usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc
        run: |
          git config user.name "六合自动更新"
          git config user.email "actions@users.noreply.github.com"
          for lottery_type in ${{ steps.check.outputs.types }}; do
            echo "开始更新彩种 ${lottery_type}"
            git pull --rebase origin main
            python scripts/update_all_lotteries.py --types "${lottery_type}" --year "$(date +%Y)"
            git add data public/generated
            git commit -m "自动保存彩种 ${lottery_type} 更新进度 [skip ci]" || true
            git push
          done

      - uses: pnpm/action-setup@v4
        if: github.event_name == 'push' || steps.check.outputs.changed == 'true' || inputs.force_deploy == true
        with:
          version: 10

      - uses: actions/setup-node@v4
        if: github.event_name == 'push' || steps.check.outputs.changed == 'true' || inputs.force_deploy == true
        with:
          node-version: "22"
          cache: pnpm

      - name: 构建网站
        if: github.event_name == 'push' || steps.check.outputs.changed == 'true' || inputs.force_deploy == true
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: 发布到 Cloudflare
        if: github.event_name == 'push' || steps.check.outputs.changed == 'true' || inputs.force_deploy == true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy --config dist/server/wrangler.json --name liuhe-formula-poster

      - name: 发布成功后确认历史已保存
        if: steps.check.outputs.changed == 'true'
        run: |
          git add data public/generated
          git commit -m "自动更新新一期公式 [skip ci]" || true
          git push
